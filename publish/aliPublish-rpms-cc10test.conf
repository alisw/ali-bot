# vim: set filetype=yaml:
---
# Throwaway el10 publisher, for proving that RPMs can be built from an
# aliBuild 2.0 (CAS) store at all. Same shape as aliPublish-rpms-cc8test.conf:
# a DIFFERENT RPM architecture, so everything the publisher writes lands in
# RPMS/el10test.x86_64/ with its own repodata and nothing points at it. Delete
# this file, and the publish-rpm-el10test.x86_64 job, once cc10 is trusted.
s3_endpoint_url: https://s3.cern.ch
s3_bucket: alibuild-repo
base_url: https://s3.cern.ch/swift/v1/alibuild-repo/
base_prefix: TARS
http_ssl_verify: True
conn_timeout_s: 6.05
conn_retries: 6
conn_dethrottle_s: 0.5

# A ceiling rather than a target: if the include below ever matches more than
# this the run stops instead of publishing a surprise.
publish_max_packages: 10

architectures:
  slc10_x86-64:
    RPM: el10test.x86_64
    include:
      # zlib, because it is the smallest real thing slc10 publishes -- the
      # release builder already treats it as a probe (zlib-test.env in
      # repo-config/mesosci/slc10-release/). With auto_include_deps its whole
      # tree is four packages: GCC-Toolchain, alibuild-recipe-tools,
      # defaults-release, zlib. That exercises stub resolution four times,
      # including on the ~1 GB GCC-Toolchain, without pulling the 37 published
      # O2PDPSuite dailies in.
      zlib:
        - ^v1\.3\.1-3$

# Deliberately on, so the RPMs have real --depends and `yum install` can be
# tried against the result with publish/test/test-repo.sh.
auto_include_deps: True

# NO notification_email block, exactly as in aliPublish-rpms-cc8test.conf: a
# trial run must not mail alice-project-analysis-task-force about RPMs nobody
# asked for. Mattermost posts still come from run-all-rpms.sh, which does not
# read this file -- expect one, naming el10test.x86_64.
