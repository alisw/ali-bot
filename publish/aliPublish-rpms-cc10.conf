# vim: set filetype=yaml:
---
s3_endpoint_url: https://s3.cern.ch
s3_bucket: alibuild-repo
base_url: https://s3.cern.ch/swift/v1/alibuild-repo/
base_prefix: TARS
http_ssl_verify: True
conn_timeout_s: 6.05
conn_retries: 6
conn_dethrottle_s: 0.5

# A ceiling, not a target: the first el10 pass resolved to 98 packages through
# auto_include_deps, so stop rather than publish a surprise beyond that.
publish_max_packages: 150

# alibuild-repo, not alibuild-cas, even though slc10 is built into the CAS
# store. The release builder writes its legacy link tree here
# (--legacy-links-store in repo-config/mesosci/slc10-release/DEFAULTS.env), so
# TARS/slc10_x86-64/{store,dist-direct}/ exist in this bucket and the publisher
# needs no new credential or endpoint. The objects under store/ are ~78-byte
# redirect stubs rather than tarballs; resolveCasStub() in aliPublishS3 follows
# them to the blob, which is world-readable over plain https.

# Explicitly list the packages which we need to publish
# to avoid ending up with a gigantic RPM repo for no good reason
architectures:
  slc10_x86-64:
    RPM: el10.x86_64
    include:
      # No slc10 EPN release has been cut yet -- O2PDPSuite has 37 dailies in
      # the store for this architecture and zero epn versions -- so this
      # publishes nothing until the first one exists, which is the intended
      # steady state rather than a placeholder.
      #
      # TO PROVE THE CHAIN BEFORE THEN, without waiting for a release: run
      #   ./aliPublishS3 --config aliPublish-rpms-cc10.conf --debug --dry-run sync-rpms
      # with one daily added here, e.g.
      #   O2PDPSuite:
      #     - ^daily-20260812-0000-1$
      # and check the logged "Source:" is an .../alibuild-cas/cas/sha256/...
      # URL rather than a .../alibuild-repo/TARS/.../store/... one. That is the
      # stub resolution working; a dry run downloads nothing.
      O2PDPSuite:
        - ^epn-2026.*$
    exclude:
      # Carried over from the cc9 config. auto_include_deps pulls gpu-system in,
      # and its version encodes the CUDA/ROCm arch lists, so the names are long
      # and comma-laden -- , becomes ____ in an RPM name.
      gpu-system:
        - .*_____.*

# What packages to publish
auto_include_deps: True

notification_email:
  server: cernmx.cern.ch
  package_format: "  %(package)s %(version)s\n"
  success:
    body: |
      Dear ALICE fellows,

        RPM %(package)s %(version)s for architecture %(arch)s was created.

      To install (you might need to force-refresh your cache):

        yum clean all
        yum install alisw-%(package)s+%(version)s

      Enjoy,
      --
      The ALICE Build Infrastructure
    subject: "[AliBuild] RPM %(package)s %(version)s created"
    from: "ALICE Builder <alibuild@cern.ch>"
    # A dict, as in the cc9/cc8 configs: notify() looks each package up and
    # sends nothing when the name is absent. A flat list here mails every
    # auto-included dependency -- 98 of them on the first el10 pass.
    to:
      O2PDPSuite:
        - alice-project-analysis-task-force@cern.ch
  failure:
    body: |
      Dear ALICE Software Librarians,

      Creation of RPM %(package)s %(version)s for architecture %(arch)s failed.

      Please have a look!

      --
      The ALICE Build Infrastructure
    subject: "[AliBuild] RPM %(package)s %(version)s failed"
    from: "ALICE Builder <alibuild@cern.ch>"
    # Likewise keyed: a broken dependency is an infrastructure problem visible
    # in the job, not 98 separate mails.
    to:
      O2PDPSuite:
        - alice-analysis-operations@cern.ch
