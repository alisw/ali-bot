# vim: set filetype=yaml:
---
# Bring-up config for the el10-x86_64 architecture on CVMFS. Deliberately
# separate from aliPublish.conf: it publishes one package to one architecture,
# so the directory layout, the relocation and the modulefile can be checked on
# a real Stratum-0 before slc10_x86-64 is added to the production config and
# picked up by the cron.
#
#   ./aliPublishS3 --config aliPublish-cvmfs-slc10.conf --debug --dry-run sync-cvmfs
#
# Drop --dry-run to publish for real. Needs AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY, and an ali-bot that resolves aliBuild 2.0 CAS stubs:
# every slc10 tarball in the store is a 78-byte redirect to alibuild-cas.

s3_endpoint_url: https://s3.cern.ch
s3_bucket: alibuild-repo
base_url: https://s3.cern.ch/swift/v1/alibuild-repo/
base_prefix: TARS
http_ssl_verify: true
conn_timeout_s: 6.05
conn_retries: 10
conn_dethrottle_s: 0.07
publish_max_packages: 10

auto_include_deps: true

# CVMFS-specific configuration, same as production.
cvmfs_repository: alice.cern.ch
cvmfs_package_dir: /cvmfs/%(repo)s/%(arch)s/Packages/%(package)s/%(version)s
cvmfs_modulefile: /cvmfs/%(repo)s/%(arch)s/Modules/modulefiles/%(package)s/%(version)s

architectures:
  slc10_x86-64:
    CVMFS: el10-x86_64
    # Only CVMFS here: AliEn registration and RPMs are separate decisions.
    AliEn: false
    RPM: false
    include:
      # Pinned to the one version that exists today, so a rebuild does not
      # silently move another gigabyte. Use `true` once the arch is live.
      GCC-Toolchain:
        - ^v14\.2\.0-alice2-1$
      # The GCC-Toolchain modulefile prereqs grid-base-packages/default, so the
      # toolchain cannot be loaded without it. Not a runtime dependency of
      # anything, so auto_include_deps never pulls it -- slc7 and slc9 list it
      # explicitly too. Must be BUILT for slc10 first: nothing exists under
      # TARS/slc10_x86-64/dist-direct/grid-base-packages/.
      grid-base-packages:
        - ^v1-[0-9]+$

# No notification_email block on purpose: nothing should mail the collaboration
# about a test publication. Copy the block from aliPublish.conf when folding
# slc10_x86-64 into it.
