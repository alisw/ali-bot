[project]
name = "security-proxy"
version = "0.1.0"
description = "Credential proxy for ALICE services (grid cert / CERN SSO / Nomad)"
# PEP 604 unions (`str | None`) are used in runtime annotations, which 3.9 evaluates
# and rejects at import time -- 3.10 is the real floor, despite what this said before.
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.138.0",
    "uvicorn==0.49.0",
    "httpx==0.28.1",
    "cryptography==49.0.0",
    "websockets==16.0",
]

[tool.setuptools]
# The package is a single top-level module. Say so explicitly: setuptools'
# auto-discovery does not find a flat py-module under a src-less layout, and an
# editable install then registers *nothing* -- the console scripts import-error at
# runtime while `pip install` reports success.
py-modules = ["security_proxy"]

[project.scripts]
security-proxy = "security_proxy:main"
security-proxy-token = "security_proxy:token_main"
security-proxy-push = "security_proxy:push_main"
security-proxy-bootstrap = "security_proxy:bootstrap_main"
security-proxy-unlock = "security_proxy:unlock_main"
security-proxy-mail-token = "security_proxy:mail_token_main"
security-proxy-device-authorize = "security_proxy:device_authorize_main"
