[build-system]
requires = ["setuptools>=61", "setuptools_scm[toml]>=8.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = 'ali-bot'
readme = "README.rst"
dynamic = ['version']
requires-python = '>=3.8.1'

description = 'ALICE Multipurpose bot'
authors = [
  {name = 'Giulio Eulisse', email = 'giulio.eulisse@cern.ch'},
]
license = {text = 'GPL'}
classifiers = [
   'Development Status :: 4 - Beta',
   'Intended Audience :: Developers',
   'Topic :: Software Development :: Build Tools',
]

keywords=[
  'HEP',
  'ALICE'
]

dependencies = [
  'PyGithub==1.46',
  'argparse',
  'requests',
  'pytz',
  's3cmd',
  'pyyaml',
  'boto3'
]

[project.optional-dependencies]
services = [
  "Twisted",
  "klein",
  "python-ldap"
]
ci = [
  "gql>=4.0.0",
  "requests-toolbelt",
  "typing-extensions==4.1.1; python_version == '3.6'",
]

utils = [
  "python-nomad",
  "python-dotenv",
  "pyfzf",
]

[project.urls]
homepage = 'https://alisw.github.io/ali-bot'

[tool.setuptools]
script-files = [
  # Continuous Integration
  "set-github-status",
  "report-pr-errors",
  "list-branch-pr",
  "alidist-override-tags",
  # Analytics
  "analytics/report-analytics",
  "analytics/report-metric-monalisa",
  # Continuous Builders
  "ci/continuous-builder.sh",
  "ci/build-helpers.sh",
  "ci/build-loop.sh",
  "ci/cleanup.py",
  "ci/queue-metrics.sh",
  "ci/otlp-push.py",
  "ci/claims.sh",
  "ci/claim-builder.sh",
  "ci/build-one.sh",
  # S3 housekeeping
  "repo-s3-cleanup",
  "daily-tags.sh",
  "build-any-ib.sh",
  "build-package",
  # Wait for open Pull Requests before daily tags
  "ci/check-open-pr",
  # Process PR permissions
  "ci/process-pull-request-http.py",
  "ci/sync-egroups.py",
  "ci/sync-mapusers.py",
  # S3 repo maintenance
  "update-symlink-manifests",
  # Helpers
  "ci-status-overview",
  "utils/cibuildhistory",
  "utils/nomad-diskfree",
  "utils/clean_pr",
  "utils/worker_status"
]

[tool.setuptools.packages.find]
include = ["*"]

[tool.setuptools_scm]

[tool.coverage.run]
# Scope it: a bare source = ["."] drags in every module in the repo, most of
# which this suite has no business exercising, so the headline number would be
# noise rather than signal. list-branch-pr has no .py extension; coverage
# traces it anyway, because it is named explicitly here.
source = ["."]

[tool.coverage.report]
# Services and one-shot utilities with no unit tests of their own. Listing them
# is a statement that they are out of scope, not that they are covered.
# `source` takes packages and directories, so the extensionless list-branch-pr
# cannot be named there -- it is selected here instead, by pattern.
include = ["list-branch-pr", "alibot_helpers/*", "ci/*"]
omit = [
  "*/process-pull-request-http.py",
  "*/tested_pkgs.py",
  "*/sync-egroups.py",
  "*/sync-mapusers.py",
  "*/missing-persons.py",
]
exclude_also = [
  "if __name__ == .__main__.:",
  # argparse declarations: exercising them tests argparse, not us. The tests
  # build a Namespace directly, which is also what keeps them readable.
  "def parse_args",
]
show_missing = true
